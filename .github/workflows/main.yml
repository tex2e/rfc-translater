
name: Python Unittest

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "master" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  unittest:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Python環境をセットアップ
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ライブラリのインストール
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Unittestの実行
      - name: Run unittest
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      - name: Check literal HTML fragments
        run: python tools/check_html_fragments.py --check --format json > /tmp/html-fragments.json

      - name: Check untranslated example introductions
        run: python tools/check_untranslated.py --check-guidance --format json > /tmp/untranslated.json

      # 全RFCの実HTMLを確認。既存の警告は保持し、新しいリンク破損を止める。
      - name: Check TOC links for regressions
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || 'HEAD^' }}
        run: python tools/check_toc.py --check-html --compare-base "$BASE_REF" --output /tmp/toc-check.json

  # 翻訳品質linter。
  # 既存データには大量の未修正欠陥があるため（tools/QUALITY_BASELINE.md 参照）、
  # 全件ではなく「このPRで変更された翻訳ファイル」だけを検査する。
  # これにより、バックログを解消しなくても新規の劣化だけを止められる。
  lint-translation:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      # 履歴全体 (約5GB) を取得するとチェックアウトだけで数分かかる。
      # コミットとツリーだけを取得し (blob:none)、作業ツリーには tools/ だけを展開する。
      # 翻訳ファイルは、変更されたものだけを次のステップでまとめて取得する。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: tools

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 変更された翻訳ファイルの変更前後の版を1回の fetch でまとめて取得し、
      # /tmp/head (変更後) と /tmp/base (マージベース) に展開する。
      # (部分クローンで git show や git checkout を使うと1ファイルずつ取得するため遅い)
      - name: Fetch changed translation files
        id: changed
        run: |
          set -e
          BASE=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          git diff --name-only --no-renames "$BASE" HEAD -- 'data/*/rfc*-trans.json' > /tmp/changed.txt
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "count=$(wc -l < /tmp/changed.txt)" >> "$GITHUB_OUTPUT"
          if [ ! -s /tmp/changed.txt ]; then
            echo "翻訳ファイルの変更なし。"
            exit 0
          fi
          xargs -a /tmp/changed.txt git ls-tree HEAD -- > /tmp/head-tree.txt
          xargs -a /tmp/changed.txt git ls-tree "$BASE" -- > /tmp/base-tree.txt
          cat /tmp/head-tree.txt /tmp/base-tree.txt | awk '{print $3}' | sort -u \
            | git -c fetch.negotiationAlgorithm=noop fetch -q origin --no-tags --no-write-fetch-head \
                --recurse-submodules=no --filter=blob:none --stdin
          for side in head base; do
            REV=HEAD; [ "$side" = base ] && REV="$BASE"
            mkdir -p "/tmp/$side"
            cut -f2 "/tmp/$side-tree.txt" > "/tmp/$side-files.txt"
            if [ -s "/tmp/$side-files.txt" ]; then
              xargs -a "/tmp/$side-files.txt" env GIT_INDEX_FILE="/tmp/$side.idx" \
                git --work-tree="/tmp/$side" checkout "$REV" --
            fi
          done
          echo "変更された翻訳ファイル: $(wc -l < /tmp/changed.txt) 件 (マージベースに存在: $(wc -l < /tmp/base-files.txt) 件)"

      - name: Warn about translation and source formatting regressions
        if: steps.changed.outputs.count != '0'
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: python tools/check_detached_clauses.py --compare-base "$BASE_REF" --format github

      # 既存データには大量の未修正欠陥があるため（tools/QUALITY_BASELINE.md 参照）、
      # 全件ではなく「このPRで変更された翻訳ファイル」だけを検査し、検出数が増えていないかを判定する。
      # 変更前後とも最新の linter で検査する（基準を揃えるため）。
      - name: Lint changed translation files
        if: steps.changed.outputs.count != '0'
        run: |
          set -e
          RFCS=$(sed -E 's#.*/rfc([0-9]+)-trans\.json#\1#' /tmp/changed.txt | sort -u)
          echo "== 対象RFC: $(echo $RFCS) =="

          # 変更後と変更前 (マージベース) の検出数。CPU数のプロセスで並列に検査する。
          python3 tools/lint_translation.py --root /tmp/head --rfc $RFCS --format text -o /tmp/head.txt || true
          AFTER=$(grep -oP '検出総数: \K\d+' /tmp/head.txt || echo 0)
          python3 tools/lint_translation.py --root /tmp/base --rfc $RFCS --format summary -o /tmp/base.txt 2>/dev/null || true
          BEFORE=$(grep -oP '検出総数: \K\d+' /tmp/base.txt || echo 0)

          echo "変更前: ${BEFORE:-0} 件 / 変更後: ${AFTER:-0} 件"
          cat /tmp/head.txt

          # 原語の置換は、他の指摘の減少で相殺されても見逃さない。
          BEFORE_SPELLING=$(awk '$1 == "W017" {print $2}' /tmp/base.txt)
          AFTER_SPELLING=$(awk '$1 == "W017" {print $2}' /tmp/head.txt)
          if [ "${AFTER_SPELLING:-0}" -gt "${BEFORE_SPELLING:-0}" ]; then
            echo "::error::RFC2119注釈の原語不一致 (W017) が増加しました。SHALL/MUST等は原文の表記を保持してください。"
            exit 1
          fi

          if [ "${AFTER:-0}" -gt "${BEFORE:-0}" ]; then
            echo "::error::翻訳品質の検出数が ${BEFORE} → ${AFTER} に増加しました。AGENTS.md の翻訳スタイルガイドを確認してください。"
            exit 1
          fi
          echo "翻訳品質の劣化はありません。"
