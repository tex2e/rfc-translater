<%page args="is_draft=False" />
  <script>
    // 描画前に表示設定を適用して、切り替え前の表示が一瞬見えるのを防ぐ。
    // ダークテーマは、保存した設定がなければOSの設定（prefers-color-scheme）に従う
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('isDarkMode'); } catch (e) {}
      var dark = saved === null ? window.matchMedia('(prefers-color-scheme: dark)').matches : saved === 'true';
      if (dark) document.documentElement.classList.add('dark-theme');
    })();
  </script>
  <link rel="shortcut icon" type="image/x-icon" href="https://tex2e.github.io/rfc-translater/favicon.ico" />
  % if is_draft == True:
  <link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="../master.css">
  <script src="../index.js"></script>
  % else:
  <link rel="stylesheet" href="./bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="./master.css">
  <script src="./index.js"></script>
  % endif
